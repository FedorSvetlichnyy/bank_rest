openapi: 3.0.3
info:
  title: Bank Cards API
  version: 0.0.1
servers:
  - url: http://localhost:8080
paths:
  /api/auth/login:
    post:
      summary: Login and get JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/cards:
    get:
      summary: List my cards (pagination + filters)
      parameters:
        - in: query
          name: status
          schema: { $ref: "#/components/schemas/CardStatus" }
        - in: query
          name: last4
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 0 }
        - in: query
          name: size
          schema: { type: integer, minimum: 1, maximum: 200 }
      responses:
        "200":
          description: Page of cards
  /api/transfers:
    post:
      summary: Transfer between my cards
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TransferRequest"
      responses:
        "200":
          description: OK
components:
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    LoginResponse:
      type: object
      properties:
        tokenType: { type: string, example: Bearer }
        accessToken: { type: string }
    TransferRequest:
      type: object
      required: [fromCardId, toCardId, amount]
      properties:
        fromCardId: { type: integer, format: int64 }
        toCardId: { type: integer, format: int64 }
        amount: { type: number, format: double, minimum: 0.01 }
    CardStatus:
      type: string
      enum: [ACTIVE, BLOCKED, EXPIRED]
