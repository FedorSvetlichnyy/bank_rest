databaseChangeLog:
  - changeSet:
      id: 001-create-tables
      author: cursor
      changes:
        - createTable:
            tableName: users
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: username, type: VARCHAR(64), constraints: { nullable: false, unique: true } }
              - column: { name: password_hash, type: VARCHAR(120), constraints: { nullable: false } }
              - column: { name: role, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: enabled, type: BOOLEAN, constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }

        - createTable:
            tableName: cards
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: owner_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: card_number_enc, type: VARCHAR(512), constraints: { nullable: false } }
              - column: { name: last4, type: VARCHAR(4), constraints: { nullable: false } }
              - column: { name: expiry, type: DATE, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: balance, type: NUMERIC(19,2), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }

        - addForeignKeyConstraint:
            baseTableName: cards
            baseColumnNames: owner_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_cards_owner

        - createIndex: { tableName: cards, indexName: idx_cards_owner_id, columns: [ { column: { name: owner_id } } ] }
        - createIndex: { tableName: cards, indexName: idx_cards_last4, columns: [ { column: { name: last4 } } ] }
        - createIndex: { tableName: cards, indexName: idx_cards_status, columns: [ { column: { name: status } } ] }

        - createTable:
            tableName: card_block_requests
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: card_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: requested_by_user_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: status, type: VARCHAR(16), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }

        - addForeignKeyConstraint:
            baseTableName: card_block_requests
            baseColumnNames: card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_block_request_card

        - addForeignKeyConstraint:
            baseTableName: card_block_requests
            baseColumnNames: requested_by_user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_block_request_user

        - createTable:
            tableName: transfers
            columns:
              - column: { name: id, type: BIGINT, autoIncrement: true, constraints: { primaryKey: true, nullable: false } }
              - column: { name: from_card_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: to_card_id, type: BIGINT, constraints: { nullable: false } }
              - column: { name: amount, type: NUMERIC(19,2), constraints: { nullable: false } }
              - column: { name: created_at, type: TIMESTAMP, constraints: { nullable: false } }

        - addForeignKeyConstraint:
            baseTableName: transfers
            baseColumnNames: from_card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_transfers_from

        - addForeignKeyConstraint:
            baseTableName: transfers
            baseColumnNames: to_card_id
            referencedTableName: cards
            referencedColumnNames: id
            constraintName: fk_transfers_to

        - createIndex: { tableName: transfers, indexName: idx_transfers_from_card, columns: [ { column: { name: from_card_id } } ] }
        - createIndex: { tableName: transfers, indexName: idx_transfers_to_card, columns: [ { column: { name: to_card_id } } ] }

